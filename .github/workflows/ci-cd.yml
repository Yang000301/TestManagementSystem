name: CI - Build and Deploy

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # =========================
  # Backend Build
  # =========================
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore TestManagementSystem.API/TestManagementSystem.API/TestManagementSystem.API.csproj

      - name: Build backend
        run: dotnet build TestManagementSystem.API/TestManagementSystem.API/TestManagementSystem.API.csproj --no-restore

  # =========================
  # Frontend Build
  # =========================
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./tms-frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./tms-frontend
        run: npm run build

  # =========================
  # Docker Build + Push GHCR
  # =========================
  build-and-push-docker:
  needs: [build-backend, build-frontend]
  runs-on: ubuntu-latest
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  permissions:
    contents: read
    packages: write

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push API image
      uses: docker/build-push-action@v6
      with:
        context: ./TestManagementSystem.API/TestManagementSystem.API
        file: ./TestManagementSystem.API/TestManagementSystem.API/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        pull: true
        no-cache: true
        tags: ghcr.io/yang000301/testmanagementsystem-api:latest

    - name: Build and push Frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./tms-frontend
        file: ./tms-frontend/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        pull: true
        no-cache: true
        tags: ghcr.io/yang000301/testmanagementsystem-frontend:latest

  # =========================
  # Deploy Oracle Cloud VM
  # =========================
  deploy:
    needs:
      - build-and-push-docker

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT }}

          script: |
            cd ~/TestManagementSystem

            git pull origin main

            echo "SQL_SA_PASSWORD=${{ secrets.SQL_SA_PASSWORD }}" > .env
            echo "JWT_KEY=${{ secrets.JWT_KEY }}" >> .env

            sudo docker compose pull
            sudo docker compose down
            sudo docker compose up -d

            sudo docker compose ps
